org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.builtInKotlin=true
android.newDsl=true
# Kotlin incremental compilation OFF: with the project on D: and the
# Pub cache on C:, incremental caches fail to close with
# "this and base files have different roots" (audio_session,
# image_picker_android, ...). Full Kotlin compile each build is
# slower but reliable.
kotlin.incremental=false
